name: truckcab
description: "TruckCab - simplifies drivers and sellers life."

publish_to: 'none'

version: 2.0.0+21


environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  audioplayers: ^6.6.0
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.4
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/notification.mp3
    - assets/sounds/delivered.mp3


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"  # your app background color
  adaptive_icon_foreground: "assets/icon/icon.png"